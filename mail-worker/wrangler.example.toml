name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			#D1 database binding name; do not change
database_name = "cloud-mail"		#D1 database name
database_id = ""		#D1 database ID

[[kv_namespaces]]
binding = "kv"			#KV binding name; do not change
id = ""					#KV namespace ID

[[r2_buckets]]
binding = "r2"			#R2 bucket binding name; do not change
bucket_name = "cloud-mail"		#R2 bucket name

#[[send_email]]
#name = "email"			#Cloudflare email sending; preferred when configured

#[ai]
#binding = "ai"

[assets]
binding = "assets"		#Static assets binding name; do not change
directory = "./dist"	#Built Vue frontend assets directory; default is dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/30 * * * *", "0 16 * * *"]	#Refresh analysis cache every 30 minutes; run daily task at midnight


[vars]
#ai_model = ""			#AI model; defaults to @cf/meta/llama-3.1-8b-instruct when empty
#ai_fallback_base_url = ""	#OpenAI-compatible base URL used when Workers AI fails. Example: https://openrouter.ai/api/v1
#ai_fallback_model = ""		#OpenAI-compatible model name. Example: openai/gpt-4o-mini
#ai_fallback_api_key = ""	#OpenAI-compatible API key. Recommended: set as a secret via `wrangler secret put ai_fallback_api_key`
#analysis_cache = false			#Whether to enable analysis data caching
#orm_log = false			#Whether to enable SQL logging
domain = ["example.com"]				#Email domains; multiple values supported. Example: ["example1.com","example2.com"]
admin = "admin@example.com"				#Admin email. Example: admin@example.com
jwt_secret = "your-jwt-secret-string"			#JWT token secret; use any random string
languages = ["id", "en", "zh", "es", "fr"]				#Available UI languages; the first item is the default. Supported: en, zh, id, es, fr

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
